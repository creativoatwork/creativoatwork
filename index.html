    <title>Creativo@Work — A New York Web and Platform Development Studio</title>

      content="A New York web and platform development studio building custom web applications, headless WordPress and WooCommerce storefronts, and LMS platforms — and modernizing legacy systems that outgrew their stack."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://creativoatwork.com/" />
    <meta property="og:title" content="Creativo@Work — A New York Web and Platform Development Studio" />
    <meta
      property="og:description"
      content="Custom web applications, headless commerce, learning platforms, and legacy modernization. A small New York studio where the people who scope the work are the people who build it."
    />
    <meta property="og:image" content="https://creativoatwork.com/img/og-card.jpg" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Creativo@Work — a New York web and platform development studio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Creativo@Work — A New York Web and Platform Development Studio" />
    <meta
      name="twitter:description"
      content="Custom web applications, headless commerce, learning platforms, and legacy modernization. A small New York studio."
    />
    <meta name="twitter:image" content="https://creativoatwork.com/img/og-card.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://creativoatwork.com/#studio",
            "name": "Creativo@Work",
            "legalName": "Creativo@Work LLC",
            "url": "https://creativoatwork.com/",
            "email": "hello@creativoatwork.com",
            "foundingDate": "2020",
            "description": "A New York web and platform development studio building custom web applications, headless WordPress and WooCommerce storefronts, and learning management systems, and modernizing legacy platforms.",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "195 Plymouth Street, Suite 5/5",
              "addressLocality": "Brooklyn",
              "addressRegion": "NY",
              "postalCode": "11201",
              "addressCountry": "US"
            },
            "areaServed": [
              { "@type": "City", "name": "New York City" },
              { "@type": "State", "name": "New York" },
              { "@type": "Country", "name": "United States" }
            ],
            "knowsAbout": [
              "Custom web application development",
              "Legacy platform modernization",
              "Headless CMS architecture",
              "Headless WordPress development",
              "WooCommerce development",
              "Learning management system development",
              "AI feature integration",
              "Cloud infrastructure and CI/CD",
              "React and TypeScript development",
              "Core Web Vitals and technical SEO"
            ],
            "openingHoursSpecification": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
              "opens": "09:00",
              "closes": "18:00"
            },
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom application engineering", "description": "Auth, dashboards, APIs, and data models built as software with a real architecture." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Legacy platform modernization", "description": "Aging codebases moved onto current stacks incrementally, in production." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Headless and composable front-ends", "description": "React and TypeScript against a decoupled CMS." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "eCommerce engineering", "description": "WooCommerce storefronts that load fast and scale with the catalog." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Learning platforms", "description": "LMS builds with cohort, certification, and reporting features." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI feature integration", "description": "Retrieval over your own content, assisted workflows, and evaluation." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cloud infrastructure and delivery", "description": "Pipelines, environments, and monitoring." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Product and interface design", "description": "Interface design grounded in your audience and your goals." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Performance, SEO and analytics", "description": "Core Web Vitals, technical SEO, and instrumentation." } }
              ]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://creativoatwork.com/#website",
            "url": "https://creativoatwork.com/",
            "name": "Creativo@Work",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://creativoatwork.com/#studio" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
